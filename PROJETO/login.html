<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MeuCofre Seguro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div class="min-h-screen flex items-center justify-center p-4">
        
        <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">
            
            <div class="flex flex-col items-center mb-8">
                <div class="p-4 bg-indigo-100 rounded-full text-indigo-600">
                    <svg class="h-10 w-10" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
                    </svg>
                </div>
                <h1 class="text-3xl font-bold text-gray-900 mt-4">MeuCofre Seguro</h1>
                <p class="text-gray-600">Destranque seu cofre</p>
            </div>

            <form id="loginForm" class="space-y-6">
                
                <div>
                    <label for="senha-mestra" class="block text-sm font-medium text-gray-700">
                        Senha Mestra
                    </label>
                    <div class="relative mt-1">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                            <ion-icon name="key-outline" class="text-gray-400 text-xl"></ion-icon>
                        </span>
                        <input id="senha-mestra" name="senha-mestra" type="password" required 
                               class="w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                </div>

                <div>
                    <label for="chave-secreta" class="block text-sm font-medium text-gray-700">
                        Chave Secreta
                    </label>
                    <div class="relative mt-1">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                            <ion-icon name="document-lock-outline" class="text-gray-400 text-xl"></ion-icon>
                        </span>
                        <input id="chave-secreta" name="chave-secreta" type="password" required 
                               class="w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                        <span class="absolute inset-y-0 right-0 flex items-center pr-3">
                            <ion-icon name="help-circle-outline" class="text-gray-400 text-xl cursor-help" title="Sua chave secreta é salva apenas no seu dispositivo."></ion-icon>
                        </span>
                    </div>
                </div>
                
                <div>
                    <button type="submit" 
                            class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-lg font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150 disabled:opacity-50">
                        Destrancar Cofre
                    </button>
                </div>
            </form>

            <div class="text-center mt-8">
                <a href="cadastro.html" class="text-sm font-medium text-indigo-600 hover:text-indigo-500">
                    Novo por aqui? Criar meu cofre
                </a>
            </div>

        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('loginForm');
            const submitButton = loginForm.querySelector('button[type="submit"]');

            loginForm.addEventListener('submit', (event) => {
                event.preventDefault(); // Impede o recarregamento da página

                const senhaMestra = document.getElementById('senha-mestra').value;
                const chaveSecreta = document.getElementById('chave-secreta').value;

                if (senhaMestra === '' || chaveSecreta === '') {
                    alert('Por favor, preencha ambos os campos.');
                    return;
                }

                submitButton.disabled = true;
                submitButton.textContent = 'Destrancando...';
                
                setTimeout(() => {
                    // Mude 'app.html' se o nome do seu arquivo principal for outro
                    window.location.href = 'app.html'; 
                    
                }, 2000);
            });
        });
    </script>

</body>
</html>
